<!DOCTYPE html>

<html lang="en">

<head>


<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Register | TaskFlow</title>

<style>

    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }

    body {
        font-family: Arial, sans-serif;

        min-height: 100vh;

        display: flex;
        justify-content: center;
        align-items: center;

        padding: 20px;

        background: linear-gradient(
            135deg,
            #667eea,
            #764ba2,
            #6b8dd6
        );
    }

    .register-container {
        width: 450px;

        background: white;

        padding: 35px;

        border-radius: 18px;

        box-shadow:
            0 25px 60px rgba(0, 0, 0, 0.25);

        animation: entry 0.6s ease;
    }

    @keyframes entry {

        from {
            opacity: 0;
            transform: translateY(30px);
        }

        to {
            opacity: 1;
            transform: translateY(0);
        }

    }

    .header {
        margin-bottom: 28px;
    }

    .header h1 {
        color: #222;

        margin-bottom: 8px;
    }

    .header p {
        color: #777;

        font-size: 14px;
    }

    .form-group {
        margin-bottom: 20px;
    }

    label {
        display: block;

        margin-bottom: 7px;

        color: #333;

        font-size: 14px;

        font-weight: bold;
    }

    input {
        width: 100%;

        padding: 12px 14px;

        border: 2px solid #e5e7eb;

        border-radius: 9px;

        outline: none;

        font-size: 14px;

        transition: 0.3s;
    }

    input:focus {
        border-color: #667eea;

        box-shadow:
            0 5px 15px rgba(102, 126, 234, 0.15);
    }

    .register-btn {
        width: 100%;

        padding: 13px;

        border: none;

        border-radius: 9px;

        background: linear-gradient(
            135deg,
            #667eea,
            #764ba2
        );

        color: white;

        font-size: 15px;

        font-weight: bold;

        cursor: pointer;

        transition: 0.3s;
    }

    .register-btn:hover {
        transform: translateY(-2px);

        box-shadow:
            0 8px 20px rgba(102, 126, 234, 0.35);
    }

    .error {
        background: #fee2e2;

        color: #b91c1c;

        padding: 10px 12px;

        border-radius: 8px;

        margin-bottom: 20px;

        font-size: 14px;
    }

    .login-link {
        text-align: center;

        margin-top: 22px;

        font-size: 14px;

        color: #6b7280;
    }

    .login-link a {
        color: #667eea;

        text-decoration: none;

        font-weight: bold;
    }

    .login-link a:hover {
        text-decoration: underline;
    }

    @media (max-width: 500px) {

        body {
            padding: 15px;
        }

        .register-container {
            width: 100%;

            padding: 25px;
        }

    }

</style>


</head>

<body>


<div class="register-container">


    <div class="header">

        <h1>
            Create Account
        </h1>

        <p>
            Register to start managing your tasks.
        </p>

    </div>


    {% if error %}

        <div class="error">
            {{ error }}
        </div>

    {% endif %}


    <form method="POST">

        {% csrf_token %}


        <!-- Username -->

        <div class="form-group">

            <label for="username">
                Username
            </label>

            <input
                type="text"
                id="username"
                name="username"
                placeholder="Enter username"
                required
            >

        </div>


        <!-- Email -->

        <div class="form-group">

            <label for="email">
                Email
            </label>

            <input
                type="email"
                id="email"
                name="email"
                placeholder="Enter email address"
                required
            >

        </div>


       <!-- Password -->

<div class="form-group">

    <label for="password">
        Password
    </label>

    <input
        type="password"
        id="password"
        name="password"
        placeholder="Enter your password"
        required
    >

</div>


<!-- Confirm Password -->

<div class="form-group">

    <label for="confirm_password">
        Confirm Password
    </label>

    <input
        type="password"
        id="confirm_password"
        name="confirm_password"
        placeholder="Confirm your password"
        required
    >

</div>


        <!-- Register -->

        <button
            type="submit"
            class="register-btn"
        >
            Create Account
        </button>


    </form>


    <div class="login-link">

        Already have an account?

        <a href="{% url 'web-login' %}">
            Login
        </a>

    </div>


</div>


</body>

</html>
