<!DOCTYPE html>

<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">


<title>
    {% if edit_mode %}Edit Task{% else %}Add Task{% endif %} | TaskFlow
</title>

<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }

    body {
        font-family: Arial, sans-serif;
        min-height: 100vh;

        display: flex;
        justify-content: center;
        align-items: center;

        padding: 30px;

        background: linear-gradient(
            135deg,
            #667eea,
            #764ba2,
            #6b8dd6
        );
    }

    .form-container {
        width: 500px;

        background: white;

        padding: 35px;

        border-radius: 18px;

        box-shadow:
            0 25px 60px rgba(0, 0, 0, 0.25);

        animation: entry 0.6s ease;
    }

    @keyframes entry {
        from {
            opacity: 0;
            transform: translateY(30px);
        }

        to {
            opacity: 1;
            transform: translateY(0);
        }
    }

    .header {
        margin-bottom: 28px;
    }

    .header h1 {
        color: #222;
        margin-bottom: 7px;
    }

    .header p {
        color: #777;
        font-size: 14px;
    }

    .form-group {
        margin-bottom: 20px;
    }

    label {
        display: block;
        margin-bottom: 7px;
        color: #333;
        font-size: 14px;
        font-weight: bold;
    }

    input,
    textarea,
    select {
        width: 100%;

        padding: 12px 14px;

        border: 2px solid #e5e7eb;

        border-radius: 9px;

        outline: none;

        font-size: 14px;

        font-family: Arial, sans-serif;

        transition: 0.3s;
    }

    textarea {
        min-height: 120px;
        resize: vertical;
    }

    input:focus,
    textarea:focus,
    select:focus {
        border-color: #667eea;

        box-shadow:
            0 5px 15px rgba(102, 126, 234, 0.15);
    }

    .row {
        display: grid;

        grid-template-columns: 1fr 1fr;

        gap: 15px;
    }

    .buttons {
        display: flex;

        gap: 12px;

        margin-top: 25px;
    }

    .btn {
        flex: 1;

        padding: 13px;

        border: none;

        border-radius: 9px;

        font-size: 15px;

        font-weight: bold;

        cursor: pointer;

        text-align: center;

        text-decoration: none;

        transition: 0.3s;
    }

    .save-btn {
        background: linear-gradient(
            135deg,
            #667eea,
            #764ba2
        );

        color: white;
    }

    .save-btn:hover {
        transform: translateY(-2px);

        box-shadow:
            0 8px 20px rgba(102, 126, 234, 0.35);
    }

    .back-btn {
        background: #f3f4f6;

        color: #374151;
    }

    .back-btn:hover {
        background: #e5e7eb;
    }

    .required {
        color: #ef4444;
    }

    @media (max-width: 600px) {

        body {
            padding: 15px;
        }

        .form-container {
            width: 100%;
            padding: 25px;
        }

        .row {
            grid-template-columns: 1fr;
        }

        .buttons {
            flex-direction: column;
        }
    }
</style>


</head>

<body>


<div class="form-container">

    <div class="header">

        <h1>
            {% if edit_mode %}
                Edit Task
            {% else %}
                Add New Task
            {% endif %}
        </h1>

        <p>
            {% if edit_mode %}
                Update your task details and save the changes.
            {% else %}
                Create a new task and manage it from your dashboard.
            {% endif %}
        </p>

    </div>


    <form
        method="POST"
        action="{% if edit_mode %}{% url 'edit-task' task.id %}{% else %}{% url 'add-task' %}{% endif %}"
    >

        {% csrf_token %}


        <!-- Title -->

        <div class="form-group">

            <label for="title">
                Task Title
                <span class="required">*</span>
            </label>

            <input
                type="text"
                id="title"
                name="title"
                placeholder="Enter task title"
                maxlength="200"
                value="{{ task.title|default:'' }}"
                required
            >

        </div>


        <!-- Description -->

        <div class="form-group">

            <label for="description">
                Description
                <span class="required">*</span>
            </label>

            <textarea
                id="description"
                name="description"
                placeholder="Describe your task..."
                required
            >{{ task.description|default:'' }}</textarea>

        </div>


        <!-- Status & Priority -->

        <div class="row">

            <div class="form-group">

                <label for="status">
                    Status
                </label>

                <select
                    id="status"
                    name="status"
                >

                    <option
                        value="pending"
                        {% if task.status == "pending" or not edit_mode %}
                            selected
                        {% endif %}
                    >
                        Pending
                    </option>

                    <option
                        value="in_progress"
                        {% if task.status == "in_progress" %}
                            selected
                        {% endif %}
                    >
                        In Progress
                    </option>

                    <option
                        value="completed"
                        {% if task.status == "completed" %}
                            selected
                        {% endif %}
                    >
                        Completed
                    </option>

                </select>

            </div>


            <div class="form-group">

                <label for="priority">
                    Priority
                </label>

                <select
                    id="priority"
                    name="priority"
                >

                    <option
                        value="low"
                        {% if task.priority == "low" %}
                            selected
                        {% endif %}
                    >
                        Low
                    </option>

                    <option
                        value="medium"
                        {% if task.priority == "medium" or not edit_mode %}
                            selected
                        {% endif %}
                    >
                        Medium
                    </option>

                    <option
                        value="high"
                        {% if task.priority == "high" %}
                            selected
                        {% endif %}
                    >
                        High
                    </option>

                </select>

            </div>

        </div>


        <!-- Due Date -->

        <div class="form-group">

            <label for="due_date">
                Due Date
            </label>

            <input
                type="date"
                id="due_date"
                name="due_date"
                value="{{ task.due_date|date:'Y-m-d' }}"
            >

        </div>


        <!-- Buttons -->

        <div class="buttons">

            <a
                href="{% url 'dashboard' %}"
                class="btn back-btn"
            >
                Back
            </a>

            <button
                type="submit"
                class="btn save-btn"
            >
                {% if edit_mode %}
                    Update Task
                {% else %}
                    Save Task
                {% endif %}
            </button>

        </div>

    </form>

</div>


</body>

</html>
